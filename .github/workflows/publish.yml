name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file
        shell: bash
        run: |
          dotnet publish -c Release -r ${{ matrix.rid }} -o out
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv out/maincast_dl.exe out/maincast_dl-${{ matrix.rid }}.exe
          else
            mv out/maincast_dl out/maincast_dl-${{ matrix.rid }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: maincast_dl-${{ matrix.rid }}
          path: out/*

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
